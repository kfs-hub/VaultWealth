<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create account — VaultWealth</title>
  <meta name="description" content="Create a free VaultWealth account to track expenses, analyze spending and get AI-powered forecasts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ghost-fibers.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="bg" aria-hidden="true"></div>

  <div class="page">
    <header class="nav">
      <a href="/" class="brand" id="navBrand">VaultWealth</a>
      <a href="/login" class="nav-link" id="navSignIn">Sign in</a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="registerTitle">
        <h1 class="auth-title" id="registerTitle">Open your <em>vault.</em></h1>
        <p class="auth-subtitle">Take control of your money in under a minute.</p>

        <div id="registerAlert" class="alert alert-info" role="status" style="display: none;"></div>

        <form id="registerForm" class="auth-form" novalidate>
          <div class="field">
            <label for="regFullName">Full name</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="regFullName" placeholder="Your name" autocomplete="name" required>
            </div>
          </div>

          <div class="field">
            <label for="regEmail">Email</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="regEmail" placeholder="name@domain.com" autocomplete="email" required>
            </div>
          </div>

          <div class="field">
            <label for="regPassword">Password</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="regPassword" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6">
            </div>
          </div>

          <div class="field">
            <label for="regConfirmPassword">Confirm password</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="regConfirmPassword" placeholder="Repeat password" autocomplete="new-password" required minlength="6">
            </div>
          </div>

          <button type="submit" class="btn-submit" id="registerSubmit">Create account</button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="/login" id="linkToLogin">Sign in</a>
        </p>
      </section>
    </main>

    <footer class="foot">
      <span>&copy; 2026 VaultWealth</span>
      
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
