<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — VaultWealth | Personal Finance Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-icon">⚡</div>
      <h1 class="brand-text">VaultWealth</h1>
      <p>Personal Finance Management & Predictive Analytics</p>
    </div>

    <div class="auth-card texture-card scroll-blur-reveal in-view">
      <div class="auth-card-header">
        <div class="card-icon-well">
          <span>⚡</span>
        </div>
        <h2 class="auth-card-title">Create your account</h2>
        <p class="auth-card-subtitle">Take control of your money, budgeting & future</p>
      </div>

      <div class="texture-separator"></div>

      <!-- Social Auth Buttons (from ui/card.txt) -->
      <div class="social-auth-group">
        <button type="button" id="googleAuthBtn" class="texture-btn-icon">
          <!-- Google Icon SVG from ui/card.txt -->
          <svg width="18" height="18" viewBox="0 0 256 262" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid">
            <path d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027" fill="#4285F4"/>
            <path d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1" fill="#34A853"/>
            <path d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782" fill="#FBBC05"/>
            <path d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251" fill="#EB4335"/>
          </svg>
          <span>Google</span>
        </button>
        <button type="button" id="githubAuthBtn" class="texture-btn-icon">
          <!-- Github Icon SVG from ui/card.txt -->
          <svg viewBox="0 0 256 250" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid">
            <path d="M128.001 0C57.317 0 0 57.307 0 128.001c0 56.554 36.676 104.535 87.535 121.46 6.397 1.185 8.746-2.777 8.746-6.158 0-3.052-.12-13.135-.174-23.83-35.61 7.742-43.124-15.103-43.124-15.103-5.823-14.795-14.213-18.73-14.213-18.73-11.613-7.944.876-7.78.876-7.78 12.853.902 19.621 13.19 19.621 13.19 11.417 19.568 29.945 13.911 37.249 10.64 1.149-8.272 4.466-13.92 8.127-17.116-28.431-3.236-58.318-14.212-58.318-63.258 0-13.975 5-25.394 13.188-34.358-1.329-3.224-5.71-16.242 1.24-33.874 0 0 10.749-3.44 35.21 13.121 10.21-2.836 21.16-4.258 32.038-4.307 10.878.049 21.837 1.47 32.066 4.307 24.431-16.56 35.165-13.12 35.165-13.12 6.967 17.63 2.584 30.65 1.255 33.873 8.207 8.964 13.173 20.383 13.173 34.358 0 49.163-29.944 59.988-58.447 63.157 4.591 3.972 8.682 11.762 8.682 23.704 0 17.126-.148 30.91-.148 35.126 0 3.407 2.304 7.398 8.792 6.14C219.37 232.5 256 184.537 256 128.002 256 57.307 198.691 0 128.001 0Z"/>
          </svg>
          <span>GitHub</span>
        </button>
      </div>

      <div class="auth-divider">
        <span>or register with email</span>
      </div>

      <!-- Dynamic Alert Box -->
      <div id="registerAlert" class="alert alert-info" style="display: none;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="regFullName" class="form-label">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="regFullName" class="form-control" placeholder="Enter your full name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="regEmail" class="form-control" placeholder="name@domain.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="regPassword" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Repeat your password" required minlength="6">
          </div>
        </div>

        <div class="texture-separator"></div>

        <button type="submit" class="btn btn-primary btn-full" style="padding: 0.8125rem; font-size: 0.9375rem;">
          <span>Create Account</span>
          <span style="font-size: 1.1rem; line-height: 1;">→</span>
        </button>
      </form>

      <!-- Subfooter (from ui/card.txt) -->
      <div class="texture-card-subfooter">
        <div>Already have an account? <a href="login.html">Sign in here</a></div>
        <div class="security-badge">
          <span>🔒</span> Secured by Supabase Row-Level Security
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
