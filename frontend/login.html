<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VaultWealth | Personal Finance Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="auth-page">
  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-icon">
        <svg class="svg-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor"></polygon>
        </svg>
      </div>
      <h1 class="brand-text">VaultWealth</h1>
      <p>Personal Finance Management & Predictive Analytics</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-card-title">Welcome back</h2>
      <p class="auth-card-subtitle">Sign in to access your financial dashboard</p>

      <!-- Dynamic Alert Box -->
      <div id="authAlert" class="alert alert-info" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="loginEmail" class="form-control" placeholder="name@domain.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.8125rem;">
          Sign In to Dashboard
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html">Create free account</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
