<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultWealth — Personal Finance Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="auth-page">
  <div class="auth-container" style="max-width: 520px; text-align: center;">
    <div class="auth-brand">
      <div class="brand-icon" style="width: 64px; height: 64px; font-size: 2rem;">⚡</div>
      <h1 class="brand-text" style="font-size: 2.25rem;">VaultWealth</h1>
      <p style="font-size: 1rem; margin-top: 0.5rem;">Intelligent Personal Finance Tracking, Analytics & Expense Forecasting</p>
    </div>

    <div class="auth-card" style="text-align: left;">
      <h2 class="auth-card-title">Welcome to VaultWealth</h2>
      <p class="auth-card-subtitle">Choose where you'd like to navigate:</p>

      <div style="display: flex; flex-direction: column; gap: 0.875rem; margin-top: 1.25rem;">
        <a href="dashboard.html" class="btn btn-primary" style="padding: 0.875rem;">
          <span>📊</span> Launch Dashboard
        </a>
        <a href="transactions.html" class="btn btn-secondary" style="padding: 0.875rem;">
          <span>💳</span> View Transactions History
        </a>
        <a href="analytics.html" class="btn btn-secondary" style="padding: 0.875rem;">
          <span>📈</span> View Analytics & Smart Insights
        </a>
        <a href="login.html" class="btn btn-secondary" style="padding: 0.875rem;">
          <span>🔐</span> Sign In / Register
        </a>
      </div>

      <div class="auth-footer" style="margin-top: 1.75rem;">
        <span style="color: var(--text-muted);">CSE 5th Semester Mini Project</span>
      </div>
    </div>
  </div>
</body>
</html>
