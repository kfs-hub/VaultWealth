<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultWealth — Personal Finance Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="auth-page">
  <div class="auth-container" style="max-width: 520px; text-align: center;">
    <div class="auth-brand">
      <div class="brand-icon" style="width: 64px; height: 64px;">
        <svg class="svg-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor"></polygon>
        </svg>
      </div>
      <h1 class="brand-text" style="font-size: 2.25rem;">VaultWealth</h1>
      <p style="font-size: 1rem; margin-top: 0.5rem;">Intelligent Personal Finance Tracking, Analytics & Expense Forecasting</p>
    </div>

    <div class="auth-card" style="text-align: left;">
      <h2 class="auth-card-title">Welcome to VaultWealth</h2>
      <p class="auth-card-subtitle">Choose where you'd like to navigate:</p>

      <div style="display: flex; flex-direction: column; gap: 0.875rem; margin-top: 1.25rem;">
        <a href="/dashboard" class="btn btn-primary" style="padding: 0.875rem;">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect>
          </svg>
          Launch Dashboard
        </a>
        <a href="/transactions" class="btn btn-secondary" style="padding: 0.875rem;">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
          View Transactions History
        </a>
        <a href="/analytics" class="btn btn-secondary" style="padding: 0.875rem;">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline>
          </svg>
          View Analytics & Smart Insights
        </a>
        <a href="/login" class="btn btn-secondary" style="padding: 0.875rem;">
          <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Sign In / Register
        </a>
      </div>

      <div class="auth-footer" style="margin-top: 1.75rem;">
        <span style="color: var(--text-muted);">CSE 5th Semester Mini Project</span>
      </div>
    </div>
  </div>
</body>
</html>
